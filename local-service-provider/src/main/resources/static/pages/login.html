<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LocalServe</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">🔧 LocalServe</div>
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your account</p>

            <div id="errorMsg" class="alert alert-error" style="display:none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>

            <p class="auth-footer">Don't have an account? <a href="/pages/register.html">Register here</a></p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await API.post('/api/auth/login', { email, password });
                localStorage.setItem('token', res.token);
                localStorage.setItem('role', res.role);
                localStorage.setItem('name', res.name);
                localStorage.setItem('userId', res.id);

                if (res.role === 'ADMIN') window.location.href = '/pages/admin-dashboard.html';
                else if (res.role === 'PROVIDER') window.location.href = '/pages/provider-dashboard.html';
                else window.location.href = '/pages/user-dashboard.html';
            } catch (err) {
                const errDiv = document.getElementById('errorMsg');
                errDiv.textContent = 'Invalid email or password';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
