<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - LocalServe</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: linear-gradient(135deg, #7c3aed 0%, #dc2626 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { background: white; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 25px 60px rgba(0,0,0,0.2); }
        .role-badge { background: #faf5ff; color: #7c3aed; padding: 0.4rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; display: inline-block; margin-bottom: 1.5rem; }
        .auth-icon { font-size: 3rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.8rem; margin-bottom: 0.3rem; color: #1e293b; }
        .subtitle { color: #888; margin-bottom: 2rem; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; color: #374151; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e5e7eb; border-radius: 10px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .form-group input:focus { border-color: #7c3aed; }
        .btn-login { width: 100%; padding: 0.85rem; background: #7c3aed; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-login:hover { background: #6d28d9; }
        .alert { padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
        .alert-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .back-link { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: #666; }
        .back-link a { color: #7c3aed; font-weight: 600; text-decoration: none; }
        .admin-note { background: #faf5ff; border: 1px solid #e9d5ff; border-radius: 8px; padding: 0.75rem; margin-bottom: 1.5rem; font-size: 0.85rem; color: #6d28d9; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div style="text-align:center;">
            <div class="auth-icon">🛡️</div>
            <span class="role-badge">Admin Portal</span>
            <h2>Admin Login</h2>
            <p class="subtitle">Platform administration access</p>
        </div>

        <div class="admin-note">🔒 Restricted access — Admins only</div>
        <div id="errorMsg" class="alert alert-error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Admin Email</label>
                <input type="email" id="email" placeholder="Enter admin email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter admin password" required>
            </div>
            <button type="submit" class="btn-login">Sign In as Admin</button>
        </form>

        <div class="back-link"><a href="/">← Back to Home</a></div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errDiv = document.getElementById('errorMsg');
            errDiv.style.display = 'none';
            try {
                const res = await API.post('/api/auth/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                if (res.role !== 'ADMIN') {
                    errDiv.textContent = 'Access denied. This portal is for administrators only.';
                    errDiv.style.display = 'block';
                    return;
                }
                localStorage.setItem('token', res.token);
                localStorage.setItem('role', res.role);
                localStorage.setItem('name', res.name);
                localStorage.setItem('userId', res.id);
                window.location.href = '/pages/admin-dashboard.html';
            } catch (err) {
                errDiv.textContent = 'Invalid credentials.';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
