<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - LocalServe</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🔧 LocalServe</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/pages/services.html">Browse Services</a>
            <span class="nav-user">👤 <span id="userName"></span></span>
            <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="dashboard">
        <div class="dashboard-header">
            <h1>My Dashboard</h1>
            <a href="/pages/services.html" class="btn btn-primary">+ Book a Service</a>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('bookings')">My Bookings</button>
            <button class="tab" onclick="showTab('profile')">My Profile</button>
        </div>

        <div id="bookings" class="tab-content active">
            <h3>My Bookings</h3>
            <div id="bookingsList" class="bookings-list">
                <p class="loading">Loading bookings...</p>
            </div>
        </div>

        <div id="profile" class="tab-content">
            <h3>My Profile</h3>
            <div class="profile-info">
                <p><strong>Name:</strong> <span id="profileName"></span></p>
                <p><strong>Role:</strong> Customer</p>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth-guard.js"></script>
    <script>
        document.getElementById('userName').textContent = localStorage.getItem('name');
        document.getElementById('profileName').textContent = localStorage.getItem('name');

        async function loadBookings() {
            const bookings = await API.authGet('/api/user/bookings');
            const list = document.getElementById('bookingsList');
            if (!bookings || bookings.length === 0) {
                list.innerHTML = '<p class="empty">No bookings yet. <a href="/pages/services.html">Book a service</a></p>';
                return;
            }
            list.innerHTML = bookings.map(b => `
                <div class="booking-card status-${b.status.toLowerCase()}">
                    <div class="booking-info">
                        <h4>${b.service.name}</h4>
                        <p>Provider: ${b.service.provider.name}</p>
                        <p>Date: ${new Date(b.bookingDate).toLocaleDateString()}</p>
                        <p>Notes: ${b.notes || 'None'}</p>
                    </div>
                    <div class="booking-status">
                        <span class="badge badge-${b.status.toLowerCase()}">${b.status}</span>
                        ${b.status === 'PENDING' || b.status === 'ACCEPTED' ? `
                        <button class="btn btn-sm btn-danger" onclick="cancelBooking(${b.id})">Cancel</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        async function cancelBooking(id) {
            if (!confirm('Cancel this booking?')) return;
            await API.authPut(`/api/bookings/${id}/status`, { status: 'CANCELLED' });
            loadBookings();
        }

        function showTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function logout() {
            localStorage.clear();
            window.location.href = '/';
        }

        loadBookings();
    </script>
</body>
</html>
