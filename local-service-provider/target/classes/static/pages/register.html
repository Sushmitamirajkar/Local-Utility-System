<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LocalServe</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">🔧 LocalServe</div>
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join LocalServe today</p>

            <div id="errorMsg" class="alert alert-error" style="display:none;"></div>
            <div id="successMsg" class="alert alert-success" style="display:none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number">
                </div>
                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address" placeholder="Enter your address">
                </div>
                <div class="form-group">
                    <label>Register As</label>
                    <select id="role">
                        <option value="USER">Customer (Looking for services)</option>
                        <option value="PROVIDER">Service Provider</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Create Account</button>
            </form>

            <p class="auth-footer">Already have an account? <a href="/pages/login.html">Sign in</a></p>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                role: document.getElementById('role').value
            };

            try {
                const res = await API.post('/api/auth/register', data);
                localStorage.setItem('token', res.token);
                localStorage.setItem('role', res.role);
                localStorage.setItem('name', res.name);
                localStorage.setItem('userId', res.id);

                document.getElementById('successMsg').textContent = 'Registration successful! Redirecting...';
                document.getElementById('successMsg').style.display = 'block';

                setTimeout(() => {
                    if (res.role === 'PROVIDER') window.location.href = '/pages/provider-dashboard.html';
                    else window.location.href = '/pages/user-dashboard.html';
                }, 1000);
            } catch (err) {
                const errDiv = document.getElementById('errorMsg');
                errDiv.textContent = err.message || 'Registration failed. Email may already be in use.';
                errDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
